name: Deploy PDF

on:
  workflow_run:
    workflows: ["Nightly Build"]
    types:
      - completed
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: thesis-pdf
          path: site

      - run: |
          cat > site/index.html <<EOF
          <!doctype html>
          <html>
          <body>
            <a href="tfg.pdf">Download PDF</a>
            <embed src="tfg.pdf" width="100%" height="1000px">
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
