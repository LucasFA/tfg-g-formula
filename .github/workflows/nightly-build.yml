name: Nightly Build

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    name: Compile LaTeX document
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Cache Nix Store
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build document
        run: nix build .#document --print-build-logs

      - name: Cleanup old nightly releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list \
            --json tagName,isPrerelease,createdAt \
            --jq '
              .[]
              | select(.isPrerelease and (.tagName | startswith("nightly-")))
              | {tag: .tagName, created: .createdAt}
            ' \
          | jq -s 'sort_by(.created) | reverse | .[7:] | .[].tag' \
          | while read tag; do
              echo "Deleting $tag"
              gh release delete "$tag" --yes
            done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly-${{ steps.date.outputs.date }}-${{ github.run_id }}
          name: Nightly Build (${{ steps.date.outputs.date }}) #${{ github.run_number }}
          body: |
            Automatically generated LaTeX PDF from the nightly build.
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            result/tfg.pdf
            result/tfg.log
          draft: false
          prerelease: true
          make_latest: "false"
