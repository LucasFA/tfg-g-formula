name: Nightly Build

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Compile LaTeX document
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Build document
        run: nix build .#document --print-build-logs

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "nightly-${{ github.run_id }}" \
            --title "Nightly Build (${{ github.run_number }})" \
            --notes "Automatically generated LaTeX PDF from the nightly build.
          Commit: ${{ github.sha }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --prerelease \
            result/tfg.pdf result/tfg.log
