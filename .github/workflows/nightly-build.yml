name: Nightly Build & Deploy PDF

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true

      - uses: Mic92/hestia@main
      # - uses: DeterminateSystems/magic-nix-cache-action@v14

      - run: nix build .#document --print-build-logs

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            tfg.pdf
            tfg.log

  deploy:
    name: Create Release & Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cleanup old nightly releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list \
            --json tagName,isPrerelease,createdAt \
            --jq '
              .[]
              | select(.isPrerelease and (.tagName | startswith("nightly-")))
              | {tag: .tagName, created: .createdAt}
            ' \
          | jq -r -s 'sort_by(.created) | reverse | .[3:] | .[].tag' \
          | while read tag; do
              echo "Deleting $tag"
              gh release delete "$tag" --yes
            done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly-${{ steps.date.outputs.date }}-${{ github.run_number }}
          name: Nightly Build (${{ steps.date.outputs.date }})
          body: |
            Automatically generated LaTeX PDF from the nightly build.
            Commit: ${{ github.sha }}
            Commit link: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            result/tfg.pdf
            result/tfg.log
          draft: false
          prerelease: true
          make_latest: "false"

      - run: |
          mkdir -p site
          cp tfg.pdf site/
          cat > site/index.html <<EOF
          <!doctype html>
          <html>
          <body>
            <a href="tfg.pdf">Download PDF</a>
            <embed src="tfg.pdf" width="100%" height="1000px">
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
